<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Azure Secure File Storage and Sharing System - Cloud-native College Computing Project on Microsoft Azure.">
    <meta name="theme-color" content="#0078D4">
    <title>{% block title %}Azure Secure File Storage and Sharing System{% endblock %}</title>
    
    <!-- Google Fonts & Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <script>
        // Global configurations injected into frontend JS
        window.APP_CONFIG = {
            maxSizeMb: {{ max_size_mb|default(25) }},
            currentUser: "{{ current_user|default('') }}"
        };
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Main Content Block -->
    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
